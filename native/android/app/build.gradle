plugins { id 'com.android.application' }
android {
    namespace 'com.andijues.chenke'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.andijues.chenke'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.2.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv('CHENKE_ANDROID_DEBUG_KEYSTORE') ?: new File(System.getProperty('user.home'), '.android/debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { debuggable false }
    }
    androidResources { noCompress += ['wasm', 'gz'] }
}
